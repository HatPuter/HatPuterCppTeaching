name: HatPuterCppTeaching-CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'

      - name: Build (qmake)
        run: |
          qmake CONFIG+=release
          make
        if: runner.os != 'Windows'

      - name: Build (qmake + mingw, Windows)
        run: |
          qmake CONFIG+=release
          mingw32-make
        if: runner.os == 'Windows'
        